# Dronecode Foundation USB ID registry
#
# Single source of truth for PID assignments under VID 0x3643.
# See README.md for the assignment process.
#
# PIDs are assigned in blocks of 16: each manufacturer claims an
# aligned block (0xNNN0-0xNNNF), listed in `blocks`, and assigns
# PIDs from inside it. Values are hexadecimal: after "0x0039"
# comes "0x003A", not "0x0040".
#
# PID format: "0x" + 4 uppercase hex digits, quoted (YAML would otherwise
# parse some values as integers).
#
# `px4_board` on a PID names the PX4 boards/<vendor>/<board> directory that
# ships it; absent means the board is not upstream yet. check_px4.py checks
# it against PX4.

vid: "0x3643"
vendor_string: "Dronecode Project, Inc."

manufacturers:
  - name: PX4/Dronecode
    px4_vendor: px4
    contact: rroche@linuxfoundation.org
    blocks: ["0x0010"]  # 0x0010-0x001F
    pids:
      - pid: "0x001D"
        board: FMU-v6XRT
        date: 2023-11-01
        px4_board: px4/fmu-v6xrt

  - name: ZeroOne
    px4_vendor: zeroone
    contact: menghua@01aero.com
    blocks: ["0x15E0"]  # 0x15E0-0x15EF
    pids:
      - pid: "0x15E0"
        board: X6
        date: 2024-08-01
        px4_board: zeroone/x6

  - name: NewBeeDrone
    # Not upstream in PX4 yet; slug matches boards/newbeedrone/ from PR #26966.
    px4_vendor: newbeedrone
    contact: kelvin@newbeedrone.com
    blocks: ["0x0050"]  # 0x0050-0x005F
    pids:
      - pid: "0x0050"
        board: PixNova
        date: 2026-04-04

  - name: Syro
    px4_vendor: syro
    contact: info@syrorobotics.com
    pids:
      - pid: "0x0001"
        board: Syro V6X
        date: 2026-08-03
        legacy: true

  - name: Agam Robotics
    px4_vendor: agam
    contact: contactus@agamrobotics.com
    pids:
      - pid: "0x0002"
        board: Agam Autopilot v6X-RT
        date: 2026-08-18
        legacy: true
        px4_board: agam/fmu-v6xrt
      - pid: "0x0003"
        board: Agam MegH7
        date: 2026-08-22
        legacy: true
        px4_board: agam/megh7

  - name: SIYI
    px4_vendor: siyi
    contact: support@siyi.biz
    blocks: ["0x04B0"]  # 0x04B0-0x04BF
    pids:
      - pid: "0x04B0"
        board: SIYI N7
        date: 2026-09-11
        px4_board: siyi/n7
      - pid: "0x04BF"
        board: SIYI UniFC 6 PICO
        date: 2026-09-11
        px4_board: siyi/unifc-6-pico

  - name: Droneer
    px4_vendor: droneer
    contact: cooperation@droneer.com
    blocks: ["0x06E0"]  # 0x06E0-0x06EF
    pids:
      - pid: "0x06E0"
        board: DroneerX6
        date: 2026-09-15

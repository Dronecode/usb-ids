name: PID assignment request
description: Request a USB product ID under the Dronecode VID (0x3643)
title: "[PID request] "
labels: [pid-request]
body:
  - type: markdown
    attributes:
      value: |
        PIDs are assigned by opening a pull request against `usb-ids.yaml`.
        If you are able to open the PR yourself, please do that instead; this
        form is for requesters who want a maintainer to make the change.
  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer name
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact email
    validations:
      required: true
  - type: textarea
    id: boards
    attributes:
      label: Board(s) the PIDs are for
      description: >-
        PIDs are assigned from your manufacturer's block of 16 (your first
        request claims one), one PID per board.
    validations:
      required: true
  - type: input
    id: px4_board
    attributes:
      label: PX4 board directory
      description: >-
        The `boards/<vendor>/<board>` directory in PX4-Autopilot that will
        use the PID, if you have one (e.g. `boards/acme/fc1`). Leave empty
        if the board is not headed upstream yet.
  - type: input
    id: usb_vendor_string
    attributes:
      label: USB vendor string
      description: >-
        The exact `CONFIG_CDCACM_VENDORSTR` your boards' defconfigs set, if
        it differs from the manufacturer name above. PX4 CI compares it
        character for character, case included.
  - type: checkboxes
    id: membership
    attributes:
      label: Dronecode membership
      options:
        - label: We are a Dronecode Foundation member
